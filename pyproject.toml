[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapecrate-mcp"
version = "1.0.0"
description = "MCP server for ScrapeCrate: YouTube, Google Maps, reviews (Trustpilot, App Store, Google Play) and Meta Ad Library data as tools for AI assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ScrapeCrate" }]
keywords = ["mcp", "ai", "youtube", "google maps", "trustpilot", "meta ad library", "web data"]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://scrapecrate.com"
Documentation = "https://scrapecrate.com/docs/mcp"

[project.scripts]
scrapecrate-mcp = "scrapecrate_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapecrate_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
